name: Build macOS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download Godot 4.6.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.6.3"
          GODOT_TAG="${GODOT_VERSION}-stable"
          GODOT_NAME="Godot_v${GODOT_VERSION}-stable"
          RELEASE_BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"

          echo "Downloading Godot from ${RELEASE_BASE}"
          curl --fail --location --retry 3 \
            "${RELEASE_BASE}/${GODOT_NAME}_macos.universal.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

          curl --fail --location --retry 3 \
            "${RELEASE_BASE}/${GODOT_NAME}_export_templates.tpz" \
            --output "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/export-templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/export-templates/templates/." "$TEMPLATE_DIR/"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Add temporary macOS export preset
        shell: bash
        run: |
          cat >> export_presets.cfg <<'EOF'

          [preset.1]

          name="macOS Public"
          platform="macOS"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="characters/public/pet.json,characters/public/animations/*.png"
          exclude_filter="characters/custom/*,private_pets/*,素材/*,tests/*,examples/*,docs/*,build/*,scripts/rig_validation.gd"
          export_path="build/public/OpenDesktopPet-v0.1.0-macOS.zip"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]

          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=0
          binary_format/architecture="universal"
          application/bundle_identifier="io.github.kai2001.opendesktoppet"
          application/signature=""
          application/app_category="Games"
          application/short_version="0.1.0"
          application/version="0.1.0"
          application/icon="res://assets/branding/birthmark_app_icon.png"
          display/high_res=true
          codesign/codesign=1
          codesign/identity=""
          codesign/certificate_file=""
          codesign/certificate_password=""
          codesign/provisioning_profile=""
          codesign/custom_options=PackedStringArray()
          notarization/notarization=0
          codesign/entitlements/app_sandbox/enabled=false
          codesign/entitlements/app_sandbox/network_server=false
          codesign/entitlements/app_sandbox/network_client=false
          codesign/entitlements/app_sandbox/device_usb=false
          codesign/entitlements/app_sandbox/device_bluetooth=false
          codesign/entitlements/allow_jit_code_execution=false
          codesign/entitlements/allow_unsigned_executable_memory=false
          codesign/entitlements/allow_dyld_environment_variables=false
          codesign/entitlements/disable_library_validation=false
          codesign/entitlements/audio_input=false
          codesign/entitlements/camera=false
          codesign/entitlements/location=false
          codesign/entitlements/address_book=false
          codesign/entitlements/calendars=false
          codesign/entitlements/photos_library=false
          codesign/entitlements/apple_events=false
          codesign/entitlements/debugging=false
          codesign/entitlements/additional=""
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=true
          EOF

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 2

      - name: Export macOS Universal ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/public
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" \
            --export-release "macOS Public" \
            "build/public/OpenDesktopPet-v0.1.0-macOS.zip"
          test -s "build/public/OpenDesktopPet-v0.1.0-macOS.zip"

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/verify-macos"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "build/public/OpenDesktopPet-v0.1.0-macOS.zip" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR" -maxdepth 2 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          test -x "$EXECUTABLE_PATH"
          file "$EXECUTABLE_PATH"
          lipo -archs "$EXECUTABLE_PATH" | tee "$RUNNER_TEMP/architectures.txt"
          grep -q 'x86_64' "$RUNNER_TEMP/architectures.txt"
          grep -q 'arm64' "$RUNNER_TEMP/architectures.txt"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesktopPet-v0.1.0-macOS
          path: build/public/OpenDesktopPet-v0.1.0-macOS.zip
          if-no-files-found: error
          retention-days: 14
